{% extends "core/base.html" %}
{% block title %}Dashboard — TaskFlow{% endblock %}

{% block body %}
<div class="app-layout">
  {% include "core/sidebar.html" %}

  <main class="main-content">
    <div class="page-header">
      <div class="topbar">
        <div>
          <h1 class="page-title">Dashboard</h1>
          <p class="page-subtitle">Welcome back, <span data-user-name>there</span> 👋</p>
        </div>
        <div style="margin-left:auto">
          <button class="btn btn-primary btn-sm" data-modal-open="createProjectModal">
            + New Project
          </button>
        </div>
      </div>
    </div>

    <div class="page-body">
      <!-- Stats -->
      <div class="stats-bar" id="statsBar">
        <div class="stat-card skeleton" style="height:100px"></div>
        <div class="stat-card skeleton" style="height:100px"></div>
        <div class="stat-card skeleton" style="height:100px"></div>
        <div class="stat-card skeleton" style="height:100px"></div>
      </div>

      <!-- Recent Projects -->
      <div class="flex items-center justify-between mb-4">
        <h2 style="font-family:var(--font-display);font-size:18px;font-weight:600">Recent Projects</h2>
        <a href="/projects/" class="btn btn-ghost btn-sm" style="color:var(--amber)">View all →</a>
      </div>
      <div class="projects-grid" id="recentProjects">
        <div class="project-card skeleton" style="height:160px"></div>
        <div class="project-card skeleton" style="height:160px"></div>
        <div class="project-card skeleton" style="height:160px"></div>
      </div>

      <!-- My Tasks -->
      <div class="flex items-center justify-between mt-8 mb-4">
        <h2 style="font-family:var(--font-display);font-size:18px;font-weight:600">My Tasks</h2>
        <div class="flex gap-2">
          <select class="form-input form-select text-sm" id="myTasksFilter" style="width:auto;padding:6px 30px 6px 10px">
            <option value="">All statuses</option>
            <option value="todo">To Do</option>
            <option value="in_progress">In Progress</option>
            <option value="in_review">In Review</option>
          </select>
        </div>
      </div>
      <div id="myTasksList"></div>
    </div>
  </main>
</div>

<!-- Create Project Modal -->
<div class="modal-backdrop" id="createProjectModal">
  <div class="modal">
    <div class="modal-header">
      <h2 class="modal-title">New Project</h2>
      <div class="modal-close" data-modal-close="createProjectModal">✕</div>
    </div>
    <form id="createProjectForm" novalidate>
      <div class="flex flex-col gap-4">
        <div class="form-group">
          <label class="form-label">Project name *</label>
          <input class="form-input" name="name" type="text" placeholder="e.g. Website Redesign" required />
        </div>
        <div class="form-group">
          <label class="form-label">Description</label>
          <textarea class="form-input" name="description" rows="3"
                    placeholder="What is this project about?" style="resize:vertical"></textarea>
        </div>
        <div class="flex gap-3">
          <div class="form-group" style="flex:1">
            <label class="form-label">Status</label>
            <select class="form-input form-select" name="status">
              <option value="active">Active</option>
              <option value="completed">Completed</option>
              <option value="archived">Archived</option>
            </select>
          </div>
          <div class="form-group" style="flex:1">
            <label class="form-label">Deadline</label>
            <input class="form-input" name="deadline" type="date" />
          </div>
        </div>
        <div class="flex gap-3" style="margin-top:8px">
          <button type="button" class="btn btn-secondary" style="flex:1" data-modal-close="createProjectModal">Cancel</button>
          <button type="submit"  class="btn btn-primary"  style="flex:1">Create Project</button>
        </div>
      </div>
    </form>
  </div>
</div>

<script src="/static/js/dashboard.js"></script>
{% endblock %}

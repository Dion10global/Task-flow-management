[pytest]
DJANGO_SETTINGS_MODULE = taskflow.settings
python_files = tests/*/test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --cov=apps
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=70
    -v

[coverage:run]
source = apps
omit =
    */migrations/*
    */tests/*
    */__init__.py

[coverage:report]
show_missing = True
skip_covered = False
